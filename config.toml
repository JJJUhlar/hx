theme = "darcula-solid"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"
rulers = [80]
true-color = true
popup-border = "all"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true


[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = false
